<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchandise Inventory — CampusNexus Admin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">
        
        <div class="page-header">
          <div>
            <h1 class="page-title">Campus Merchandise & Inventory</h1>
            <p class="page-subtitle">Manage store catalog, stock quantities, apparel sizes, and product prices.</p>
          </div>
          <a href="/admin/product-form.html" class="btn btn-primary">+ Add New Product</a>
        </div>

        <div class="card">
          <div id="products-table-container"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('ADMIN');

    async function loadProducts() {
      const container = document.getElementById('products-table-container');
      utils.renderLoading(container, 'Loading store merchandise...');

      try {
        const res = await api.get('/products');
        if (!res.success || !res.data.products || res.data.products.length === 0) {
          utils.renderEmpty(container, 'No products found');
          return;
        }

        const products = res.data.products;
        container.innerHTML = `
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Product ID</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th>Current Price</th>
                  <th>Inventory Stock</th>
                  <th>Variants / Sizes</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${products.map(p => `
                  <tr>
                    <td><strong style="font-family: monospace;">#${p.productId}</strong></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.category}</td>
                    <td><strong style="color: var(--text-primary);">${utils.formatCurrency(p.price)}</strong></td>
                    <td>
                      <strong style="color: ${p.stock > 0 ? 'var(--accent-emerald)' : 'var(--accent-rose)'};">
                        ${p.stock} units
                      </strong>
                    </td>
                    <td>${p.variants.join(', ')} / ${p.sizes.join(', ')}</td>
                    <td>${utils.renderBadge(p.status)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message, loadProducts);
      }
    }

    loadProducts();
  </script>
</body>
</html>
