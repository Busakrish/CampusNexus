<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details — CampusNexus Organizer</title>
  <meta name="description" content="View event details, manage registrations, monitor capacity, and access attendance records.">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">

        <div class="page-header">
          <div>
            <a href="/organizer/events.html" style="font-size: 0.85rem; color: var(--text-muted); display: inline-block; margin-bottom: 0.5rem;">← Back to Events</a>
            <h1 class="page-title" id="event-title">Loading...</h1>
            <p class="page-subtitle" id="event-subtitle"></p>
          </div>
          <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;" id="event-actions"></div>
        </div>

        <!-- Event Info Cards -->
        <div class="metrics-grid" id="metrics-grid">
          <div class="metric-card accent-cyan">
            <div class="metric-info">
              <span class="metric-label">Capacity</span>
              <span class="metric-value" id="stat-capacity">...</span>
            </div>
            <div class="metric-icon-box">👥</div>
          </div>
          <div class="metric-card accent-purple">
            <div class="metric-info">
              <span class="metric-label">Registered</span>
              <span class="metric-value" id="stat-registered">...</span>
            </div>
            <div class="metric-icon-box">📝</div>
          </div>
          <div class="metric-card accent-emerald">
            <div class="metric-info">
              <span class="metric-label">Seats Left</span>
              <span class="metric-value" id="stat-seats">...</span>
            </div>
            <div class="metric-icon-box">🎟️</div>
          </div>
          <div class="metric-card accent-amber">
            <div class="metric-info">
              <span class="metric-label">Checked In</span>
              <span class="metric-value" id="stat-attended">...</span>
            </div>
            <div class="metric-icon-box">✅</div>
          </div>
        </div>

        <div class="dashboard-grid">

          <!-- Event Details -->
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Event Information</h2>
              <span id="status-badge"></span>
            </div>
            <div id="event-info-container"></div>
          </div>

          <!-- Capacity Progress -->
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Capacity Overview</h2>
            </div>
            <div id="capacity-container" style="padding: 0.5rem 0;">
              <div style="height: 24px; background: var(--bg-surface-elevated); border-radius: 12px; overflow: hidden; margin-bottom: 1rem;">
                <div id="capacity-bar" style="height: 100%; border-radius: 12px; background: linear-gradient(90deg, var(--primary), var(--accent-cyan)); transition: width 0.5s ease; width: 0%;"></div>
              </div>
              <p id="capacity-text" style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;"></p>
            </div>
          </div>

          <!-- Registrations Table -->
          <div class="card dashboard-full">
            <div class="card-header">
              <h2 class="card-title">Registrations</h2>
              <div style="display: flex; gap: 0.5rem;">
                <select class="form-control" id="reg-status-filter" style="width: auto;" onchange="loadRegistrations()">
                  <option value="">All</option>
                  <option value="pending">Pending</option>
                  <option value="confirmed">Confirmed</option>
                  <option value="cancelled">Cancelled</option>
                </select>
                <a href="/organizer/qr-scanner.html" class="btn btn-primary btn-sm">📷 QR Scanner</a>
              </div>
            </div>
            <div id="registrations-container"></div>
          </div>

        </div>

      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('ORGANIZER', 'ADMIN');

    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    if (!eventId) { window.location.href = '/organizer/events.html'; }

    let eventData = null;

    async function loadEvent() {
      try {
        const res = await api.get(`/events/${eventId}`);
        if (!res.success) throw new Error(res.message);
        eventData = res.data.event;

        document.getElementById('event-title').textContent = eventData.eventName;
        document.getElementById('event-subtitle').textContent = `${eventData.category || ''} · ${utils.formatDate(eventData.startDate)} at ${eventData.startTime || ''}`;
        document.getElementById('status-badge').innerHTML = utils.renderBadge(eventData.status);

        // Metrics
        const registered = eventData.registrationCount ?? eventData.registeredCount ?? 0;
        const cap = eventData.maximumCapacity ?? eventData.capacityLimit ?? 100;
        const seats = eventData.availableSeats ?? Math.max(0, cap - registered);
        document.getElementById('stat-capacity').textContent = cap;
        document.getElementById('stat-registered').textContent = registered;
        document.getElementById('stat-seats').textContent = seats;
        document.getElementById('stat-attended').textContent = eventData.attendanceCount ?? 0;

        // Capacity bar
        const pct = cap > 0 ? Math.min(100, (registered / cap) * 100) : 0;
        document.getElementById('capacity-bar').style.width = pct + '%';
        document.getElementById('capacity-bar').style.background = pct >= 90 ? 'linear-gradient(90deg, #E11D48, #F43F5E)' : 'linear-gradient(90deg, var(--primary), var(--accent-cyan))';
        document.getElementById('capacity-text').textContent = `${registered} of ${cap} spots filled (${pct.toFixed(0)}%)`;

        // Info
        document.getElementById('event-info-container').innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 0.85rem;">
            <div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md);">
              <span style="color: var(--text-muted);">📍 Venue</span>
              <strong>${eventData.venue || 'TBD'}</strong>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md);">
              <span style="color: var(--text-muted);">📅 Start</span>
              <strong>${utils.formatDate(eventData.startDate)} ${eventData.startTime || ''}</strong>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md);">
              <span style="color: var(--text-muted);">🏁 End</span>
              <strong>${utils.formatDate(eventData.endDate)} ${eventData.endTime || ''}</strong>
            </div>
            <div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md);">
              <span style="color: var(--text-muted);">💰 Fee</span>
              <strong>${eventData.registrationFee > 0 ? utils.formatCurrency(eventData.registrationFee) : '<span style="color:var(--accent-emerald)">Free</span>'}</strong>
            </div>
            ${eventData.description ? `<div style="padding: 0.85rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md);"><p style="color: var(--text-secondary); font-size: 0.9rem; margin: 0;">${eventData.description}</p></div>` : ''}
          </div>
        `;

        // Actions
        const actionsDiv = document.getElementById('event-actions');
        actionsDiv.innerHTML = `
          <a href="/organizer/events.html" class="btn btn-secondary">Edit Event ✏️</a>
          <a href="/organizer/qr-scanner.html?eventId=${eventId}" class="btn btn-primary">📷 QR Scanner</a>
          <a href="/organizer/attendance.html?eventId=${eventId}" class="btn btn-secondary">✅ Attendance</a>
        `;

        loadRegistrations();
      } catch (err) {
        utils.toast(err.message, 'error');
      }
    }

    async function loadRegistrations() {
      const container = document.getElementById('registrations-container');
      utils.renderLoading(container);
      try {
        const statusFilter = document.getElementById('reg-status-filter').value;
        const params = { eventId };
        if (statusFilter) params.status = statusFilter;
        const res = await api.get('/registrations', params);
        if (!res.success) throw new Error(res.message);
        const regs = res.data.registrations || [];

        if (regs.length === 0) {
          utils.renderEmpty(container, 'No registrations yet', 'Students will appear here once they register for this event.');
          return;
        }

        container.innerHTML = `
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Reg ID</th>
                  <th>Student Name</th>
                  <th>Email</th>
                  <th>Registered On</th>
                  <th>Payment Status</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${regs.map(r => {
                  const sUpper = (r.status || '').toUpperCase();
                  return `
                    <tr>
                      <td><strong style="font-family:monospace;">#${r.registrationId}</strong></td>
                      <td>${r.user ? r.user.name : r.userId}</td>
                      <td>${r.user ? r.user.email : '—'}</td>
                      <td>${utils.formatDate(r.createdAt)}</td>
                      <td>${utils.renderBadge(r.paymentStatus || 'Pending')}</td>
                      <td>${utils.renderBadge(r.status)}</td>
                      <td>
                        <div style="display:flex; gap:0.4rem;">
                          ${sUpper === 'PENDING' ? `
                            <button class="btn btn-success btn-sm" onclick="updateRegStatus('${r.registrationId}','Confirmed')">Confirm</button>
                            <button class="btn btn-danger btn-sm" onclick="updateRegStatus('${r.registrationId}','Cancelled')">Cancel</button>
                          ` : ''}
                          ${sUpper === 'CONFIRMED' ? `<button class="btn btn-danger btn-sm" onclick="updateRegStatus('${r.registrationId}','Cancelled')">Cancel</button>` : ''}
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message);
      }
    }

    async function updateRegStatus(registrationId, status) {
      const action = status === 'Confirmed' ? 'Confirm' : 'Cancel';
      if (!confirm(`${action} this registration?`)) return;
      try {
        const res = await api.put(`/registrations/${registrationId}/status`, { status });
        if (res.success) { utils.toast(`Registration ${status}.`, 'success'); loadRegistrations(); }
        else throw new Error(res.message);
      } catch (err) {
        utils.toast(err.message, 'error');
      }
    }

    loadEvent();
  </script>
</body>
</html>
