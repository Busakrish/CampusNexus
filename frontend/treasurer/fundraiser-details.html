<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fundraiser Collections Audit — CampusNexus Treasurer</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">
        
        <div style="margin-bottom: 1.5rem;">
          <a href="/treasurer/fundraisers.html" class="btn btn-secondary btn-sm">← Back to Campaigns</a>
        </div>

        <div id="fundraiser-audit-container"></div>

      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('TREASURER', 'ADMIN');

    const params = new URLSearchParams(window.location.search);
    const fundraiserId = params.get('id');

    async function loadAudit() {
      const container = document.getElementById('fundraiser-audit-container');
      if (!fundraiserId) {
        utils.renderError(container, 'No campaign ID specified.');
        return;
      }

      utils.renderLoading(container, 'Loading collection logs...');

      try {
        const res = await api.get(`/fundraisers/${fundraiserId}`);
        if (!res.success || !res.data.fundraiser) throw new Error(res.message);

        const { fundraiser, organization, collections } = res.data;

        container.innerHTML = `
          <div class="card" style="margin-bottom: 1.5rem;">
            <div class="card-header">
              <div>
                <span style="font-size: 0.8rem; color: var(--accent-cyan); font-weight: 700; text-transform: uppercase;">
                  ${organization ? organization.name : 'Campaign'}
                </span>
                <h1 style="font-size: 1.75rem; margin-top: 0.25rem;">${fundraiser.name}</h1>
              </div>
              ${utils.renderBadge(fundraiser.status)}
            </div>

            <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">${fundraiser.purpose}</p>

            <div style="background: var(--bg-surface-elevated); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
              <div style="display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 0.5rem;">
                <span>Total Verified Income: <strong style="color: var(--accent-emerald);">${utils.formatCurrency(fundraiser.collectedAmount)}</strong></span>
                <span style="color: var(--text-muted);">Target: ${utils.formatCurrency(fundraiser.targetAmount)} (${res.data.progressPercentage}%)</span>
              </div>
              <div style="width: 100%; height: 10px; background: var(--bg-surface); border-radius: 5px; overflow: hidden;">
                <div style="width: ${res.data.progressPercentage}%; height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-emerald));"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Collections Verification Queue</h2>
            </div>
            ${collections && collections.length > 0 ? `
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Collection ID</th>
                      <th>Contributor</th>
                      <th>Volunteer Logged</th>
                      <th>Amount</th>
                      <th>Method</th>
                      <th>Date</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${collections.map(c => `
                      <tr>
                        <td><strong style="font-family: monospace;">#${c.collectionId}</strong></td>
                        <td>
                          <strong>${c.contributor.name}</strong>
                          <div style="font-size: 0.8rem; color: var(--text-muted);">${c.contributor.email || ''}</div>
                        </td>
                        <td><code>${c.volunteerId}</code></td>
                        <td><strong style="color: var(--text-primary); font-size: 0.95rem;">${utils.formatCurrency(c.amount)}</strong></td>
                        <td>${c.paymentMethod}</td>
                        <td>${utils.formatDate(c.createdAt)}</td>
                        <td>${utils.renderBadge(c.status)}</td>
                        <td>
                          <div class="table-actions">
                            ${c.status === 'Pending' ? `
                              <button class="btn btn-success btn-sm" onclick="verifyCollection('${c.collectionId}', ${c.amount})">Verify & Post Inflow ✓</button>
                              <button class="btn btn-danger btn-sm" onclick="rejectCollection('${c.collectionId}')">Reject</button>
                            ` : '<span style="color: var(--text-muted); font-size: 0.8rem;">Processed</span>'}
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<p style="color: var(--text-muted); font-size: 0.9rem;">No collections submitted for this campaign.</p>'}
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message, loadAudit);
      }
    }

    async function verifyCollection(colId, amount) {
      const confirmed = await utils.confirmDialog(
        'Verify Collection',
        `Confirm receipt of ${utils.formatCurrency(amount)}? This will atomically increment the campaign total and post an Income Transaction to the finance ledger.`,
        'Verify & Credit'
      );
      if (!confirmed) return;

      try {
        await api.put(`/collections/${colId}/verify`);
        utils.toast('Collection verified and credited to finance ledger!', 'success');
        loadAudit();
      } catch (err) {
        utils.toast(err.message, 'error');
      }
    }

    async function rejectCollection(colId) {
      const reason = prompt('Please enter rejection audit reason:');
      if (!reason) return;

      try {
        await api.put(`/collections/${colId}/reject`, { reason });
        utils.toast('Collection marked as Rejected.', 'info');
        loadAudit();
      } catch (err) {
        utils.toast(err.message, 'error');
      }
    }

    loadAudit();
  </script>
</body>
</html>
