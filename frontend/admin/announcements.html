<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Announcements — CampusNexus Admin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">
        
        <div class="page-header">
          <div>
            <h1 class="page-title">Campus Announcements</h1>
            <p class="page-subtitle">Publish targeted bulletins to students, volunteers, treasurers, and organizers.</p>
          </div>
          <a href="/admin/announcement-form.html" class="btn btn-primary">+ Create Announcement</a>
        </div>

        <div class="card">
          <div id="announcements-table-container"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('ADMIN');

    async function loadAnnouncements() {
      const container = document.getElementById('announcements-table-container');
      utils.renderLoading(container, 'Loading announcements...');

      try {
        const res = await api.get('/announcements');
        if (!res.success || !res.data.announcements || res.data.announcements.length === 0) {
          utils.renderEmpty(container, 'No announcements created yet');
          return;
        }

        const anns = res.data.announcements;
        container.innerHTML = `
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Target Audience</th>
                  <th>Scope</th>
                  <th>Published Date</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${anns.map(a => `
                  <tr>
                    <td>
                      <strong>${a.title}</strong>
                      <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.2rem;">
                        ${a.content.length > 80 ? a.content.substring(0, 77) + '...' : a.content}
                      </div>
                    </td>
                    <td><span class="badge badge-info">${a.audience}</span></td>
                    <td>${a.scope}</td>
                    <td>${utils.formatDate(a.publishedAt || a.createdAt)}</td>
                    <td>${utils.renderBadge(a.status)}</td>
                    <td>
                      ${a.status === 'Pending Approval' ? `
                        <button class="btn btn-primary btn-sm" onclick="approveAnnouncement('${a.announcementId}')">Approve & Broadcast</button>
                      ` : '<span style="color: var(--text-muted); font-size: 0.8rem;">Published</span>'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message, loadAnnouncements);
      }
    }

    async function approveAnnouncement(id) {
      try {
        await api.put(`/announcements/${id}/approve`);
        utils.toast('Announcement approved and broadcasted!', 'success');
        loadAnnouncements();
      } catch (err) {
        utils.toast(err.message, 'error');
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
