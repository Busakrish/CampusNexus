<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Claim Details — CampusNexus</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">
        
        <div style="margin-bottom: 1.5rem;">
          <a href="/volunteer/expenses.html" class="btn btn-secondary btn-sm">← Back to Expenses</a>
        </div>

        <div id="expense-details-container"></div>

      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('VOLUNTEER', 'TREASURER', 'ADMIN');

    const params = new URLSearchParams(window.location.search);
    const expenseId = params.get('id');

    async function loadExpense() {
      const container = document.getElementById('expense-details-container');
      if (!expenseId) {
        utils.renderError(container, 'No expense ID specified.');
        return;
      }

      utils.renderLoading(container, 'Loading claim information...');

      try {
        const res = await api.get(`/expenses/${expenseId}`);
        if (!res.success || !res.data.expense) throw new Error(res.message);

        const { expense, submitter, reimbursement } = res.data;

        container.innerHTML = `
          <div class="card" style="max-width: 760px;">
            <div class="card-header">
              <div>
                <span style="font-size: 0.8rem; color: var(--text-muted); font-family: monospace;">CLAIM #${expense.expenseId}</span>
                <h1 style="font-size: 1.6rem; margin-top: 0.25rem;">${expense.category} Claim</h1>
              </div>
              ${utils.renderBadge(expense.status)}
            </div>

            <div style="font-size: 1rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.75rem;">
              <h4 style="color: var(--text-primary); margin-bottom: 0.4rem;">Description</h4>
              <p>${expense.description}</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; background: var(--bg-surface-elevated); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-bottom: 1.75rem;">
              <div>
                <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Claimed Amount</span>
                <div style="font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-top: 0.2rem;">
                  ${utils.formatCurrency(expense.amount)}
                </div>
              </div>

              <div>
                <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Submitted Date</span>
                <div style="font-weight: 700; margin-top: 0.2rem;">
                  📅 ${utils.formatDate(expense.createdAt)}
                </div>
              </div>

              <div>
                <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Submitted By</span>
                <div style="font-weight: 700; margin-top: 0.2rem;">
                  👤 ${submitter ? submitter.name : expense.submittedBy}
                </div>
              </div>

              <div>
                <span style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Reimbursement Status</span>
                <div style="margin-top: 0.2rem;">
                  ${reimbursement ? utils.renderBadge(reimbursement.status) : '<span style="color: var(--text-muted); font-size: 0.85rem;">Not generated</span>'}
                </div>
              </div>
            </div>

            ${expense.receiptUrl ? `
              <div style="margin-bottom: 1.5rem;">
                <h4 style="margin-bottom: 0.75rem; font-size: 1rem;">Attached Receipt Proof</h4>
                <img src="${expense.receiptUrl}" alt="Receipt" style="max-width: 100%; max-height: 350px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
              </div>
            ` : ''}

            ${expense.rejectionReason ? `
              <div style="background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); padding: 1rem; border-radius: var(--radius-md); color: var(--accent-rose); font-size: 0.9rem;">
                <strong>Rejection Reason:</strong> ${expense.rejectionReason}
              </div>
            ` : ''}
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message, loadExpense);
      }
    }

    loadExpense();
  </script>
</body>
</html>
