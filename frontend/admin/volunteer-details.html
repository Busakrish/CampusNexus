<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer Profile & Workload — CampusNexus Admin</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">
        
        <div style="margin-bottom: 1.5rem;">
          <a href="/admin/volunteers.html" class="btn btn-secondary btn-sm">← Back to Volunteers</a>
        </div>

        <div id="volunteer-details-container"></div>

      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('ADMIN');

    const params = new URLSearchParams(window.location.search);
    const userId = params.get('id');

    async function loadVolunteer() {
      const container = document.getElementById('volunteer-details-container');
      if (!userId) {
        utils.renderError(container, 'No volunteer specified.');
        return;
      }

      utils.renderLoading(container, 'Loading volunteer workload...');

      try {
        const [uRes, taskRes] = await Promise.all([
          api.get(`/users/${userId}`),
          api.get('/tasks', { assignedVolunteerId: userId })
        ]);

        const user = uRes.data.user;
        const tasks = taskRes.data.tasks || [];

        container.innerHTML = `
          <div class="card" style="margin-bottom: 1.5rem; max-width: 800px;">
            <div class="card-header">
              <div>
                <span style="font-size: 0.8rem; color: var(--text-muted); font-family: monospace;">VOLUNTEER #${user.userId}</span>
                <h1 style="font-size: 1.6rem; margin-top: 0.25rem;">${user.name}</h1>
              </div>
              ${utils.renderBadge(user.status)}
            </div>
            <div style="display: flex; gap: 2rem; font-size: 0.95rem; color: var(--text-secondary);">
              <div>📧 <strong>${user.email}</strong></div>
              <div>📞 <strong>${user.phone || 'No phone'}</strong></div>
              <div>📋 Total Tasks Assigned: <strong>${tasks.length}</strong></div>
            </div>
          </div>

          <div class="card" style="max-width: 800px;">
            <div class="card-header">
              <h2 class="card-title">Assigned Tasks List</h2>
              <a href="/admin/task-form.html?volunteerId=${user.userId}" class="btn btn-primary btn-sm">+ Assign Task</a>
            </div>

            ${tasks.length > 0 ? `
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Task Title</th>
                      <th>Due Date</th>
                      <th>Limit</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tasks.map(t => `
                      <tr>
                        <td><strong>${t.title}</strong></td>
                        <td>${utils.formatDate(t.dueDate)}</td>
                        <td>${t.spendingLimit > 0 ? utils.formatCurrency(t.spendingLimit) : '$0'}</td>
                        <td>${utils.renderBadge(t.status)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<p style="color: var(--text-muted); font-size: 0.9rem;">No tasks assigned to this volunteer.</p>'}
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message, loadVolunteer);
      }
    }

    loadVolunteer();
  </script>
</body>
</html>
