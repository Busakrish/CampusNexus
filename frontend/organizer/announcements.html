<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements — CampusNexus Organizer</title>
  <meta name="description" content="Compose and publish announcements to event attendees, members, and campus students.">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/tables.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div class="main-wrapper">
      <main class="content-container">

        <div class="page-header">
          <div>
            <h1 class="page-title">Announcements</h1>
            <p class="page-subtitle">Publish notices to event attendees, organization members, or all students.</p>
          </div>
          <button class="btn btn-primary" id="compose-btn">+ New Announcement</button>
        </div>

        <div id="announcements-container"></div>

      </main>
    </div>
  </div>

  <!-- Compose Modal -->
  <div class="modal-overlay" id="compose-modal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="card-header" style="margin-bottom: 1.5rem;">
        <h2 class="card-title">Compose Announcement</h2>
        <button class="btn btn-secondary btn-sm" id="close-compose-btn">✕</button>
      </div>
      <form id="compose-form">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" class="form-control" id="f-title" placeholder="Event Update: Venue Change" required>
        </div>
        <div class="form-group">
          <label class="form-label">Message *</label>
          <textarea class="form-control" id="f-body" rows="5" placeholder="Write your announcement here..." required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Target Audience</label>
          <select class="form-control" id="f-audience">
            <option value="all">All Students</option>
            <option value="members">Organization Members Only</option>
            <option value="event_registered">Event Registrants</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-control" id="f-priority">
            <option value="normal">Normal</option>
            <option value="important">Important</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('compose-modal').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="send-btn">Publish Announcement</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    auth.requireRole('ORGANIZER', 'ADMIN');

    document.getElementById('compose-btn').onclick = () => document.getElementById('compose-modal').classList.add('active');
    document.getElementById('close-compose-btn').onclick = () => document.getElementById('compose-modal').classList.remove('active');

    document.getElementById('compose-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('send-btn');
      btn.disabled = true; btn.textContent = 'Publishing...';

      try {
        const res = await api.post('/announcements', {
          title: document.getElementById('f-title').value.trim(),
          body: document.getElementById('f-body').value.trim(),
          audience: document.getElementById('f-audience').value,
          priority: document.getElementById('f-priority').value
        });
        if (!res.success) throw new Error(res.message);
        utils.toast('Announcement published!', 'success');
        document.getElementById('compose-modal').classList.remove('active');
        document.getElementById('compose-form').reset();
        loadAnnouncements();
      } catch (err) {
        utils.toast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Publish Announcement';
      }
    });

    async function loadAnnouncements() {
      const container = document.getElementById('announcements-container');
      utils.renderLoading(container);
      try {
        const res = await api.get('/announcements');
        if (!res.success) throw new Error(res.message);
        const anns = res.data.announcements || [];
        if (anns.length === 0) {
          utils.renderEmpty(container, 'No announcements yet', 'Create an announcement to notify your students and members.');
          return;
        }

        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            ${anns.map(a => `
              <div class="card card-hover">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.75rem;">
                  <div>
                    <h3 style="font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem;">${a.title}</h3>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                      ${utils.renderBadge(a.status || 'active')}
                      ${a.priority && a.priority !== 'normal' ? `<span class="badge badge-${a.priority === 'urgent' ? 'danger' : 'pending'}">${a.priority.toUpperCase()}</span>` : ''}
                      <span style="font-size: 0.8rem; color: var(--text-muted);">To: ${a.audience || 'all'}</span>
                    </div>
                  </div>
                  <span style="font-size: 0.8rem; color: var(--text-muted); white-space: nowrap;">${utils.formatDate(a.createdAt)}</span>
                </div>
                <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin: 0;">${a.body}</p>
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) {
        utils.renderError(container, err.message);
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
